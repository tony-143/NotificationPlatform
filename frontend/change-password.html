<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notification Platform - Change Password</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
    <div id="pageLoading" class="page-loading">
        <span class="spinner spinner-lg" aria-hidden="true"></span>
        <p>Checking your session…</p>
    </div>

    <div class="bg-animation">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>
    
    <div class="auth-container">
        <div class="auth-card fade-in">
            <div class="auth-header">
                <div class="logo">
                    <svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect width="40" height="40" rx="12" fill="url(#gradient)"/>
                        <path d="M20 10L25 18H15L20 10Z" fill="white"/>
                        <rect x="17" y="19" width="6" height="8" rx="1" fill="white"/>
                        <circle cx="20" cy="29" r="1" fill="white"/>
                        <defs>
                            <linearGradient id="gradient" x1="0" y1="0" x2="40" y2="40">
                                <stop stop-color="#6366f1"/>
                                <stop offset="1" stop-color="#a855f7"/>
                            </linearGradient>
                        </defs>
                    </svg>
                </div>
                <h1>Change Password</h1>
                <p>Update your password to keep your account secure</p>
            </div>
            
            <form id="changePasswordForm" class="auth-form">
                <div class="form-group">
                    <label for="currentPassword">Current Password</label>
                    <input type="password" id="currentPassword" name="currentPassword" placeholder="Enter current password" required autocomplete="current-password">
                </div>
                
                <div class="form-group">
                    <label for="newPassword">New Password</label>
                    <input type="password" id="newPassword" name="newPassword" placeholder="Enter new password (min 8 chars)" required autocomplete="new-password">
                </div>
                
                <div class="form-group">
                    <label for="confirmPassword">Confirm New Password</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm new password" required autocomplete="new-password">
                </div>
                
                <button type="submit" id="changePasswordBtn" class="btn btn-primary btn-block">
                    <span>Update Password</span>
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                        <path d="M16.667 5L7.5 14.167 3.333 10" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
            </form>
            
            <div class="auth-footer">
                <p><a href="dashboard.html" class="link">← Back to Dashboard</a></p>
            </div>
            
            <div id="errorMessage" class="alert alert-error" style="display: none;"></div>
            <div id="successMessage" class="alert alert-success" style="display: none;"></div>
        </div>
    </div>
    
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script>
        const changeForm = document.getElementById('changePasswordForm');
        const changeButton = document.getElementById('changePasswordBtn');
        const changeError = document.getElementById('errorMessage');
        const changeSuccess = document.getElementById('successMessage');

        document.addEventListener('DOMContentLoaded', async () => {
            const authenticated = await requireAuth('index.html?expired=1');
            if (authenticated) {
                setPageLoading(false);
            }
        });

        changeForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const currentPassword = document.getElementById('currentPassword').value;
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            hideAlert(changeError);
            hideAlert(changeSuccess);

            if (newPassword !== confirmPassword) {
                showAlert(changeError, 'error', 'New passwords do not match');
                return;
            }

            if (newPassword.length < 8) {
                showAlert(changeError, 'error', 'Password must be at least 8 characters');
                return;
            }

            setFormBusy(changeForm, true);
            setButtonLoading(changeButton, true, 'Updating…');

            try {
                // This endpoint is CSRF protected, so use authFetch (adds X-XSRF-TOKEN).
                const response = await authFetch(`${API_BASE_URL}/api/users/me/password`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ currentPassword, newPassword })
                });

                if (response.status === 204) {
                    showAlert(changeSuccess, 'success', 'Password updated successfully! Redirecting to dashboard…');
                    changeForm.reset();
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 1400);
                    return;
                }

                const data = await readJson(response);
                const message = data?.message || 'Failed to change password';

                if (response.status === 401 && !message.toLowerCase().includes('current password')) {
                    showAlert(changeError, 'error', 'Your session has expired. Redirecting to sign in…');
                    setTimeout(() => {
                        window.location.href = 'index.html?expired=1';
                    }, 1400);
                } else {
                    showAlert(changeError, 'error', message);
                }
            } catch (error) {
                showAlert(changeError, 'error', 'Unable to reach the server. Please try again.');
            } finally {
                setButtonLoading(changeButton, false);
                setFormBusy(changeForm, false);
            }
        });
    </script>
</body>
</html>
