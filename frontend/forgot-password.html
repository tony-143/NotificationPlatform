<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notification Platform - Forgot Password</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
    <div class="bg-animation">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>
    
    <div class="auth-container">
        <div class="auth-card fade-in">
            <div class="auth-header">
                <div class="logo">
                    <svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect width="40" height="40" rx="12" fill="url(#gradient)"/>
                        <path d="M20 10L25 18H15L20 10Z" fill="white"/>
                        <rect x="17" y="19" width="6" height="8" rx="1" fill="white"/>
                        <circle cx="20" cy="29" r="1" fill="white"/>
                        <defs>
                            <linearGradient id="gradient" x1="0" y1="0" x2="40" y2="40">
                                <stop stop-color="#6366f1"/>
                                <stop offset="1" stop-color="#a855f7"/>
                            </linearGradient>
                        </defs>
                    </svg>
                </div>
                <h1>Reset Password</h1>
                <p>Enter your email to receive password reset instructions</p>
            </div>
            
            <form id="forgotForm" class="auth-form">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="you@example.com" required autocomplete="email">
                </div>
                
                <button type="submit" id="forgotBtn" class="btn btn-primary btn-block">
                    <span>Send Reset Code</span>
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                        <path d="M3.333 10h13.334M10 3.333L16.667 10 10 16.667" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
            </form>

            <a id="continueReset" href="reset-password.html" class="btn btn-primary btn-block" style="display: none; margin-bottom: 1.5rem;">
                Enter Reset Code
            </a>
            
            <div class="auth-footer">
                <p><a href="index.html" class="link">← Back to Sign In</a></p>
                <p style="margin-top: 0.5rem;"><a href="reset-password.html" class="link">Have a reset code?</a></p>
            </div>
            
            <div id="infoMessage" class="alert alert-info" style="display: none;"></div>
            <div id="errorMessage" class="alert alert-error" style="display: none;"></div>
        </div>
    </div>
    
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script>
        const forgotForm = document.getElementById('forgotForm');
        const forgotButton = document.getElementById('forgotBtn');
        const forgotError = document.getElementById('errorMessage');
        const forgotInfo = document.getElementById('infoMessage');
        const continueReset = document.getElementById('continueReset');

        forgotForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            hideAlert(forgotError);
            hideAlert(forgotInfo);

            setFormBusy(forgotForm, true);
            setButtonLoading(forgotButton, true, 'Sending code…');

            try {
                const response = await fetch(`${API_BASE_URL}/api/auth/forgot-password`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    credentials: 'include',
                    body: JSON.stringify({ email })
                });

                const data = await readJson(response);

                if (response.ok) {
                    localStorage.setItem(STORAGE_KEYS.pendingEmail, email);
                    showAlert(
                        forgotInfo,
                        'info',
                        data?.message || 'If an account exists with this email, a password reset code has been sent.'
                    );
                    forgotForm.style.display = 'none';
                    continueReset.href = `reset-password.html?email=${encodeURIComponent(email)}`;
                    continueReset.style.display = 'inline-flex';
                } else if (response.status >= 500) {
                    showAlert(forgotError, 'error', 'The reset code could not be sent right now. Please try again later.');
                } else {
                    showAlert(forgotError, 'error', data?.message || 'Request failed');
                }
            } catch (error) {
                showAlert(forgotError, 'error', 'Unable to reach the server. Please try again.');
            } finally {
                setButtonLoading(forgotButton, false);
                setFormBusy(forgotForm, false);
            }
        });
    </script>
</body>
</html>
