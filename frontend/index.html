<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notification Platform - Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
    <div class="bg-animation">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>
    
    <div class="auth-container">
        <div class="auth-card fade-in">
            <div class="auth-header">
                <div class="logo">
                    <svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect width="40" height="40" rx="12" fill="url(#gradient)"/>
                        <path d="M20 10L25 18H15L20 10Z" fill="white"/>
                        <rect x="17" y="19" width="6" height="8" rx="1" fill="white"/>
                        <circle cx="20" cy="29" r="1" fill="white"/>
                        <defs>
                            <linearGradient id="gradient" x1="0" y1="0" x2="40" y2="40">
                                <stop stop-color="#6366f1"/>
                                <stop offset="1" stop-color="#a855f7"/>
                            </linearGradient>
                        </defs>
                    </svg>
                </div>
                <h1>Welcome Back</h1>
                <p>Sign in to your Notification Platform account</p>
            </div>
            
            <form id="loginForm" class="auth-form">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="you@example.com" required autocomplete="email">
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter your password" required autocomplete="current-password">
                </div>
                
                <div class="form-row">
                    <a href="forgot-password.html" class="link">Forgot Password?</a>
                </div>
                
                <button type="submit" id="loginBtn" class="btn btn-primary btn-block">
                    <span>Sign In</span>
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                        <path d="M7.5 15L12.5 10L7.5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
            </form>
            
            <div class="auth-footer">
                <p>Don't have an account? <a href="register.html" class="link">Sign up</a></p>
                <p style="margin-top: 0.5rem;"><a href="verify-email.html" class="link">Verify email</a></p>
            </div>
            
            <div id="errorMessage" class="alert alert-error" style="display: none;"></div>
        </div>
    </div>
    
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script>
        const loginForm = document.getElementById('loginForm');
        const loginButton = document.getElementById('loginBtn');
        const loginError = document.getElementById('errorMessage');

        // The dashboard redirects here when the session cookie is no longer valid.
        const loginParams = new URLSearchParams(window.location.search);
        if (loginParams.get('expired') === '1') {
            if (loginParams.get('reason') === 'network') {
                showAlert(
                    loginError,
                    'error',
                    `Could not reach the API at ${API_BASE_URL}. Check that the backend is running and that this page's origin is allowed by CORS.`
                );
            } else {
                showAlert(loginError, 'info', 'Your session has expired. Please sign in again.');
                console.warn(
                    `[auth] Session check failed. Page origin: ${window.location.origin}, API: ${API_BASE_URL}. ` +
                    'Both must use the same hostname (localhost or 127.0.0.1) for the session cookie to be sent.'
                );
            }
        }

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            hideAlert(loginError);

            setFormBusy(loginForm, true);
            setButtonLoading(loginButton, true, 'Signing in…');

            try {
                const response = await fetch(`${API_BASE_URL}/api/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    credentials: 'include',
                    body: JSON.stringify({ email, password })
                });

                if (response.ok) {
                    const user = await readJson(response);
                    if (user) {
                        localStorage.setItem(STORAGE_KEYS.user, JSON.stringify(user));
                    }
                    localStorage.setItem(STORAGE_KEYS.pendingEmail, email);
                    window.location.href = 'dashboard.html';
                    return;
                }

                const data = await readJson(response);
                const message = data?.message || 'Login failed';

                if (response.status === 403) {
                    // Unverified account: point the user at the OTP verification page.
                    showAlert(loginError, 'error', `${message} `);
                    const verifyLink = document.createElement('a');
                    verifyLink.className = 'link';
                    verifyLink.href = `verify-email.html?email=${encodeURIComponent(email)}`;
                    verifyLink.textContent = 'Verify your email →';
                    loginError.append(verifyLink);
                    localStorage.setItem(STORAGE_KEYS.pendingEmail, email);
                } else {
                    showAlert(loginError, 'error', message);
                }
            } catch (error) {
                showAlert(loginError, 'error', 'Unable to reach the server. Please make sure the backend is running and try again.');
            } finally {
                setButtonLoading(loginButton, false);
                setFormBusy(loginForm, false);
            }
        });
    </script>
</body>
</html>
