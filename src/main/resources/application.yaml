spring:
  application:
    name: demo
  config:
    import: "optional:file:./local-secrets.properties"
  datasource:
    url: jdbc:postgresql://localhost:5432/notification
    username: postgres
    password: tony
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        globally_quoted_identifiers: true
  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
server:
  port: 8081
app:
  jwt:
    secret: cFyKTX58ilglvPd3+VBwFV3lhEnZOiVKc6ML8j2SPK4=
    expiration-ms: 900000
    cookie-secure: ${APP_AUTH_COOKIE_SECURE:false}
  notifications:
    poll-interval-ms: 60000
    batch-size: 100
    max-retries: 5
    retry-delay-seconds: 10
  idempotency:
    cleanup-interval-ms: 60000
  mail:
    enabled: ${SMTP_ENABLED:false}
    from: ${SMTP_FROM:}